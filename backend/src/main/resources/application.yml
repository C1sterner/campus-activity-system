server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
spring:
  application:
    name: campus-activity-system
  datasource:
    url: jdbc:h2:file:./data/campus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DEMO_DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  seed-demo: ${SEED_DEMO:true}
  storage-dir: ${UPLOAD_DIR:./data/uploads}
  token-hours: 2
